worker_processes 1;
error_log /dev/stderr warn;
pid /run/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;

    client_body_temp_path /run/nginx/client_body;
    proxy_temp_path /run/nginx/proxy;
    fastcgi_temp_path /run/nginx/fastcgi;
    uwsgi_temp_path /run/nginx/uwsgi;
    scgi_temp_path /run/nginx/scgi;

    client_max_body_size 100m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream skyvern_api {
        server 127.0.0.1:8000;
    }

    upstream skyvern_ui {
        server 127.0.0.1:8081;
    }

    upstream skyvern_artifacts {
        server 127.0.0.1:9090;
    }

    upstream skyvern_mcp {
        server 127.0.0.1:8003;
    }

    server {
        listen 8080;
        server_name _;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Remote MCP is a separate process. Publish it under /api so it sits on
        # the single proxyauth exclusion prefix.
        location = /api/mcp {
            proxy_pass http://skyvern_mcp/mcp;
        }

        location /api/mcp/ {
            proxy_pass http://skyvern_mcp/mcp/;
        }

        location /api/ {
            proxy_pass http://skyvern_api;
        }

        location /v1/ {
            proxy_pass http://skyvern_api;
        }

        location /mcp {
            proxy_pass http://skyvern_mcp;
        }

        # UI calls ${ORIGIN}/artifacts + /artifact/... so strip the public prefix.
        location /artifacts/ {
            proxy_pass http://skyvern_artifacts/;
        }

        location / {
            proxy_pass http://skyvern_ui;
        }
    }
}
